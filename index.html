<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RED-BATCH — Controlled Release Apparel</title>
  <meta name="description" content="Controlled release streetwear from South Africa. Every drop is documented, verified, and logged. CYCLE-01 now active." />
  <meta name="theme-color" content="#EDEAE4" />

  <meta property="og:title" content="RED-BATCH — CYCLE-01 · Release Active." />
  <meta property="og:description" content="Controlled release apparel. South Africa. 120 units. No restock." />
  <meta property="og:image" content="https://redbatch.store/images/og-image.jpg" />
  <meta property="og:url" content="https://redbatch.store" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="RED-BATCH — CYCLE-01 · Release Active." />
  <meta name="twitter:description" content="Controlled release apparel. South Africa. 120 units. No restock." />
  <meta name="twitter:image" content="https://redbatch.store/images/og-image.jpg" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23EDEAE4'/><rect x='46' y='0' width='18' height='18' fill='%23C22B26'/><text x='32' y='42' font-family='monospace' font-weight='bold' font-size='22' fill='%23141414' text-anchor='middle'>RB</text></svg>" />

  <link rel="stylesheet" href="/styles.css">

  <!-- Preloader: pure CSS/HTML so it paints before React loads. -->
  <style>
    #preloader {
      position: fixed; inset: 0; z-index: 99995; background: #EDEAE4;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.45s ease, visibility 0.45s;
    }
    #preloader.done { opacity: 0; visibility: hidden; }
    html.intro-seen #preloader { display: none; }
    .pl-mark { display: flex; align-items: center; gap: 14px; animation: pl-in 0.7s cubic-bezier(0.22,1,0.36,1) both; }
    .pl-sq { width: 14px; height: 14px; background: #C22B26; animation: pl-blink 1.1s steps(2) infinite; }
    .pl-word {
      font-family: monospace; font-size: 13px; letter-spacing: 0.34em;
      text-transform: uppercase; color: #141414; font-weight: 700;
    }
    .pl-line {
      position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #D3CEC4;
      transform-origin: left; overflow: hidden;
    }
    .pl-line::after {
      content: ''; position: absolute; inset: 0; background: #C22B26;
      transform: translateX(-100%); animation: pl-sweep 1.15s cubic-bezier(0.65,0,0.35,1) forwards;
    }
    @keyframes pl-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes pl-blink { 50% { opacity: 0.15; } }
    @keyframes pl-sweep { to { transform: translateX(0); } }
  </style>
  <script>
    (function () {
      if (sessionStorage.getItem('rb-intro')) document.documentElement.classList.add('intro-seen');
      // Failsafe: never trap the user on the loader if the app fails to boot.
      setTimeout(function () {
        var p = document.getElementById('preloader');
        if (p) p.classList.add('done');
      }, 4000);
    })();
  </script>
</head>
<body>

  <div id="preloader" aria-hidden="true">
    <div class="pl-mark"><span class="pl-sq"></span><span class="pl-word">RED-BATCH</span></div>
    <div class="pl-line"></div>
  </div>

  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

</body>
</html>
